  left: 8%;
}

.orb-2 {

  right: 6%;
  bottom: 10%;
}

  text-align: center;
  position: relative;
  z-index: 1;
}
 
h2 {
  font-weight: 700;
  margin: 0 0 12px;
  color: #8ae9ff;
  letter-spacing: 0.02em;
  text-shadow: 0 0 10px rgba(54, 208, 255, 0.5);
}
 
#menu {
  position: absolute;
  top: 22px;
  right: 22px;
  font-size: 30px;
  cursor: pointer;
  user-select: none;
  color: #9ae8ff;
  width: 42px;
  height: 42px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  background: rgba(17, 53, 83, 0.8);
  border: 1px solid rgba(129, 193, 255, 0.3);

}

#menu:hover {
  transform: translateY(-1px);
}
 
ul.menu-items {

  right: 22px;

  margin: 0;
  width: 190px;
  display: none;
  overflow: hidden;

ul.menu-items li {

ul.menu-items li:hover {

#date {

}
 
#verse {

}

  border-radius: 14px;
  padding: 16px 18px;
  text-align: left;
}

button:hover {

button:active {

#prayerInput {

  resize: vertical;
}
 
#prayer-list {

}

.prayer-name {

  color: #8de9ff;
  margin-bottom: 10px;
}
 
.prayer-time {
  font-size: 12px;
  color: #a9dff9;
  margin-top: 12px;
  opacity: 0.9;

.prayer-item button {

  margin: 0;
  font-size: 13px;
  border-radius: 10px;

  box-shadow: 0 10px 20px rgba(229, 75, 99, 0.2);
}

.reaction-bar {

  flex-wrap: wrap;
  gap: 8px;
  margin-top: 14px;

.reaction-button {

}

}
</style>

<div class="bg-orb orb-1"></div>
<div class="bg-orb orb-2"></div>

<div id="container">

    <input
      id="name"
      placeholder="Your Name (optional)"

    <textarea
      id="prayerInput"
      placeholder="Write your prayer here..."
      autocomplete="off"
    ></textarea>

    <button>Submit Prayer</button>

    <div id="prayer-list"></div>
  </div>
</div>

    const safeText = String(value ?? '');
    return safeText.replace(/[&<>"']/g, (match) => ({

      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#039;'

  }

  }

  function safeStorageSet(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch (error) {
      console.warn(`Unable to store ${key}:`, error);
    }
  }

  function getCurrentUserId() {
    const key = 'prayer_wall_user_id';
    const existing = safeStorageGet(key, null);
    if (existing) return existing;

    const userId = (typeof crypto !== 'undefined' && crypto.randomUUID)
      ? crypto.randomUUID()
      : `guest-${Date.now()}-${Math.random().toString(16).slice(2)}`;

    safeStorageSet(key, userId);
    return userId;
  }

  function getLocalPrayers() {
    const rawPrayers = Array.isArray(safeStorageGet('prayers', [])) ? safeStorageGet('prayers', []) : [];
    let changed = false;
    const normalized = rawPrayers.map((item) => {
      if (!item || typeof item !== 'object') return item;
      if (!item.id) {
        item.id = `${Date.now()}-${Math.random().toString(16).slice(2)}`;
        changed = true;
      }
      return item;
    });

    if (changed) {
      safeStorageSet('prayers', normalized);
    }

    return normalized.filter(Boolean);
  }

  function getLocalReactionMap() {
    try {
      return safeStorageGet('prayer_reactions', {});
    } catch (error) {
      return {};
    }
  }

  function setLocalReactionMap(reactions) {
    safeStorageSet('prayer_reactions', reactions);
  }

  function getPrayerReactionState(prayerId) {
    const reactionMap = (supabase ? state.supabaseReactionMap : getLocalReactionMap())[prayerId] || {};
    const counts = Object.fromEntries(reactionOptions.map((reaction) => [reaction.key, 0]));

    Object.values(reactionMap).forEach((reactionKey) => {
      if (counts[reactionKey] !== undefined) counts[reactionKey] += 1;
    });

    return {
      counts,
      userReaction: reactionMap[getCurrentUserId()] || null
    };
  }

  function formatPrayerDate(dateValue) {
    const date = dateValue instanceof Date ? dateValue : new Date(dateValue);
    if (Number.isNaN(date.getTime())) {
      return 'Just now';
    }
    return `${date.toLocaleDateString()} at ${date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`;
  }

  function getPrayerDate(prayer) {
    if (prayer.created_at) return new Date(prayer.created_at);
    if (prayer.date && prayer.time) return new Date(`${prayer.date} ${prayer.time || '00:00:00'}`);
    return new Date();
  }

  function fetchRandomVerse() {
    const chosenVerse = verses[randomInt(verses.length)];
    refs.verse.textContent = `${chosenVerse.text} — ${chosenVerse.verse}`;
    refs.prayer.innerHTML = formatVersePrayer(chosenVerse.text, chosenVerse.verse);
    if (refs.status) refs.status.textContent = '';
  }

  function toggleMenu() {
    const isOpen = refs.menuList.style.display === 'block';
    refs.menuList.style.display = isOpen ? 'none' : 'block';
    refs.menuButton.setAttribute('aria-expanded', String(!isOpen));
  }

  function hideMenu() {
    refs.menuList.style.display = 'none';
    refs.menuButton.setAttribute('aria-expanded', 'false');
  }

  function showVerseTab() {
    refs.verseTab.style.display = 'block';
    refs.prayerTab.style.display = 'none';
    hideMenu();
  }

  function showPrayerTab() {
    refs.verseTab.style.display = 'none';
    refs.prayerTab.style.display = 'block';
    hideMenu();
  }

  function displayDate() {
    const today = new Date();
    refs.date.textContent = today.toLocaleDateString('en-US', {
      weekday: 'long',
      year: 'numeric',
      month: 'long',
      day: 'numeric'
    });
  }

  function buildPrayerMarkup(prayer) {
    const prayerText = prayer.content || prayer.prayer || '';
    const prayerName = prayer.name || 'Anonymous';
    const prayerId = String(prayer.id || `${prayerName}-${prayerText}-${Date.now()}`);
    const prayerDate = getPrayerDate(prayer);
    const currentUserId = getCurrentUserId();
    const isOwner = Boolean(prayer.owner_id) && prayer.owner_id === currentUserId;
    const canManage = Boolean(prayer.id) && isOwner;
    const reactionState = getPrayerReactionState(prayerId);

    const reactionButtons = reactionOptions.map((reaction) => `
      <button
        type="button"
        class="reaction-button ${reactionState.userReaction === reaction.key ? 'active' : ''}"
        data-action="react"
        data-prayer-id="${escapeHtml(prayerId)}"
        data-reaction="${reaction.key}"
        aria-label="React with ${reaction.key}"
      >
        <span>${reaction.emoji}</span>
        <span>${reactionState.counts[reaction.key] || 0}</span>
      </button>
    `).join('');

    const manageActions = canManage ? `
      <div class="prayer-actions">
        <button type="button" data-action="edit" data-id="${escapeHtml(String(prayer.id || ''))}" class="secondary-button">Edit</button>
        <button type="button" data-action="delete" data-id="${escapeHtml(String(prayer.id || ''))}" class="danger-button">Delete</button>
      </div>
    ` : '';

    return `
      <div class="prayer-name">${escapeHtml(prayerName)}</div>
      <div>${escapeHtml(prayerText)}</div>
      <div class="prayer-time">${formatPrayerDate(prayerDate)}</div>
      <div class="reaction-bar">${reactionButtons}</div>
      ${manageActions}
    `;
  }

  function renderPrayerItems(prayers) {
    const list = refs.prayerList;
    list.innerHTML = '';

    if (!prayers.length) {
      list.innerHTML = '<div class="prayer-item">No prayers yet. Be the first to pray.</div>';
      return;
    }

    prayers.forEach((prayer) => {
      const item = document.createElement('div');
      item.className = 'prayer-item';
      item.dataset.id = prayer.id || '';
      item.innerHTML = buildPrayerMarkup(prayer);
      list.appendChild(item);
    });
  }

  async function fetchSupabaseReactions(prayerIds) {
    if (!supabase || !Array.isArray(prayerIds) || !prayerIds.length) return {};

    try {
      const { data, error } = await supabase
        .from('prayer_reactions')
        .select('prayer_id, user_id, reaction')
        .in('prayer_id', prayerIds);

      if (error) {
        console.error('Failed to load reactions:', error);
        return {};
      }

      const map = {};
      data.forEach((reaction) => {
        map[reaction.prayer_id] = map[reaction.prayer_id] || {};
        map[reaction.prayer_id][reaction.user_id] = reaction.reaction;
      });
      return map;
    } catch (error) {
      console.error('fetchSupabaseReactions error:', error);
      return {};
    }
  }

  async function togglePrayerReaction(prayerId, reactionKey) {
    if (!prayerId || !reactionKey) return;

    if (supabase) {
      const userId = getCurrentUserId();
      const { data: existing, error: selectError } = await supabase
        .from('prayer_reactions')
        .select('id, reaction')
        .eq('prayer_id', prayerId)
        .eq('user_id', userId)
        .maybeSingle();

      if (selectError) {
        console.error('Error checking existing reaction:', selectError);
        alert('Unable to save reaction. Check the prayer_reactions table permissions in Supabase.');
        return;
      }

      if (existing && existing.reaction === reactionKey) {
        const { error } = await supabase
          .from('prayer_reactions')
          .delete()
          .eq('id', existing.id);

        if (error) {
          console.error('Failed to remove reaction:', error);
          alert('Unable to remove reaction right now.');
          return;
        }
        return;
      }

      if (existing) {
        const { error } = await supabase
          .from('prayer_reactions')
          .update({ reaction: reactionKey })
          .eq('id', existing.id);

        if (error) {
          console.error('Failed to update reaction:', error);
          alert('Unable to save reaction right now.');
          return;
        }
        return;
      }

      const { error } = await supabase
        .from('prayer_reactions')
        .insert([{ prayer_id: prayerId, user_id: userId, reaction: reactionKey }]);

      if (error) {
        console.error('Failed to insert reaction:', error);
        alert('Unable to save reaction. Check the prayer_reactions table permissions in Supabase.');
      }
      return;
    }

    const reactionMap = getLocalReactionMap();
    const prayerReactions = reactionMap[prayerId] || {};
    const userId = getCurrentUserId();
    const currentReaction = prayerReactions[userId];

    if (currentReaction === reactionKey) {
      delete prayerReactions[userId];
    } else {
      prayerReactions[userId] = reactionKey;
    }

    reactionMap[prayerId] = prayerReactions;
    setLocalReactionMap(reactionMap);
  }

  async function displayPrayers() {
    refs.prayerList.innerHTML = '<div class="prayer-item">Loading prayers...</div>';

    if (supabase) {
      const { data, error } = await supabase
        .from('prayers')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Supabase fetch failed:', error);
        refs.prayerList.innerHTML = error.code === '42501'
          ? '<div class="prayer-item">Supabase needs SELECT permission on the prayers table. Run: GRANT SELECT ON public.prayers TO anon;</div>'
          : '<div class="prayer-item">Unable to load prayers right now.</div>';
        return;
      }

      const prayerIds = (data || []).map((prayer) => String(prayer.id));
      state.supabaseReactionMap = await fetchSupabaseReactions(prayerIds);
      renderPrayerItems(data || []);
      return;
    }

    renderPrayerItems(getLocalPrayers());
  }

  async function submitPrayer() {
    const name = refs.nameInput.value.trim() || 'Anonymous';
    const prayer = refs.prayerInput.value.trim();

    if (!prayer) {
      alert('Please enter a prayer.');
      return;
    }

    const ownerId = getCurrentUserId();

    if (supabase) {
      const { error } = await supabase
        .from('prayers')
        .insert([{ name, content: prayer, owner_id: ownerId }]);

      if (error) {
        console.error('Supabase prayer insert failed:', error);
        if (error.code === '42501') {
          alert('Supabase needs permission to insert prayers. Run: GRANT INSERT ON public.prayers TO anon;');
        } else {
          alert('Failed to save prayer. Please try again.');
        }
        return;
      }
    } else {
      const now = new Date();
      const entry = {
        id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
        name,
        prayer,
        owner_id: ownerId,
        date: now.toLocaleDateString(),
        time: now.toLocaleTimeString(),
        created_at: now.toISOString()
      };

      const prayers = getLocalPrayers();
      prayers.unshift(entry);
      safeStorageSet('prayers', prayers);
    }

    refs.nameInput.value = '';
    refs.prayerInput.value = '';
    await displayPrayers();
  }

  function bindEvents() {
    refs.menuButton.addEventListener('click', toggleMenu);
    refs.menuButton.setAttribute('aria-expanded', 'false');

    const menuItems = refs.menuList.querySelectorAll('li');
    menuItems[0]?.addEventListener('click', showVerseTab);
    menuItems[1]?.addEventListener('click', showPrayerTab);

    document.querySelector('#verseTab button')?.addEventListener('click', fetchRandomVerse);
    document.querySelector('#prayerTab button')?.addEventListener('click', submitPrayer);

    refs.prayerList.addEventListener('click', async (event) => {
      const target = event.target.closest('[data-action]');
      if (!target) return;

      const action = target.dataset.action;

      if (action === 'react') {
        await togglePrayerReaction(target.dataset.prayerId, target.dataset.reaction);
        await displayPrayers();
        return;
      }

      if (action === 'delete') {
        const id = target.dataset.id;
        if (!id) return;

        const confirmed = window.confirm('Delete this prayer?');
        if (!confirmed) return;

        if (!supabase) {
          const localPrayers = getLocalPrayers().filter((item) => item.id !== id);
          safeStorageSet('prayers', localPrayers);
          const reactionMap = getLocalReactionMap();
          delete reactionMap[id];
          setLocalReactionMap(reactionMap);
          await displayPrayers();
          return;
        }

        const currentUserId = getCurrentUserId();
        const { data: deletedPrayers, error } = await supabase
          .from('prayers')
          .delete()
          .eq('id', id)
          .eq('owner_id', currentUserId)
          .select('id');

        if (error) {
          console.error('Supabase prayer delete failed:', error);
          alert('Unable to delete prayer. Check the prayers table DELETE policy in Supabase.');
          return;
        }

        if (!deletedPrayers || deletedPrayers.length === 0) {
          alert('This prayer could not be deleted. Your Supabase DELETE policy may be blocking it.');
          return;
        }

        try {
          await supabase.from('prayer_reactions').delete().eq('prayer_id', id);
        } catch (err) {
          console.warn('Error deleting reactions after prayer delete:', err);
        }

        await displayPrayers();
        return;
      }

      if (action === 'edit') {
        const id = target.dataset.id;
        if (!id) return;

        let existingText = '';

        if (supabase) {
          const { data, error } = await supabase.from('prayers').select('*').eq('id', id).maybeSingle();
          if (error) {
            console.error('Unable to read prayer for edit:', error);
            alert('Unable to edit this prayer right now.');
            return;
          }
          existingText = data?.content || data?.prayer || '';
        } else {
          const localPrayer = getLocalPrayers().find((item) => item.id === id);
          existingText = localPrayer?.prayer || localPrayer?.content || '';
        }

        const nextPrayer = prompt('Edit your prayer:', existingText);
        if (nextPrayer === null) return;

        const trimmed = nextPrayer.trim();
        if (!trimmed) {
          alert('Prayer cannot be empty.');
          return;
        }

        if (!supabase) {
          const localPrayers = getLocalPrayers().map((item) => item.id === id ? { ...item, prayer: trimmed, owner_id: getCurrentUserId() } : item);
          safeStorageSet('prayers', localPrayers);
          await displayPrayers();
          return;
        }

        const { data: updatedPrayers, error } = await supabase
          .from('prayers')
          .update({ content: trimmed })
          .eq('id', id)
          .eq('owner_id', getCurrentUserId())
          .select('id');

        if (error) {
          console.error('Supabase prayer update failed:', error);
          alert('Unable to edit prayer. Check the prayers table UPDATE policy in Supabase.');
          return;
        }

        if (!updatedPrayers || updatedPrayers.length === 0) {
          alert('This prayer could not be edited. Your Supabase UPDATE policy may be blocking it.');
          return;
        }

        await displayPrayers();
      }
    });

    document.addEventListener('click', (event) => {
      const target = event.target;
      if (refs.menuList.style.display === 'block' && !refs.menuList.contains(target) && target !== refs.menuButton) {
        hideMenu();
      }
    });
  }

  function initializeApp() {
    if (window.__prayerAppInitialized) return;
    window.__prayerAppInitialized = true;

    refs.menuButton = document.getElementById('menu');
    refs.menuList = document.getElementById('menu-items');
    refs.verseTab = document.getElementById('verseTab');
    refs.prayerTab = document.getElementById('prayerTab');
    refs.date = document.getElementById('date');
    refs.verse = document.getElementById('verse');
    refs.prayer = document.getElementById('prayer');
    refs.status = document.getElementById('status');
    refs.nameInput = document.getElementById('name');
    refs.prayerInput = document.getElementById('prayerInput');
    refs.prayerList = document.getElementById('prayer-list');

    displayDate();
    fetchRandomVerse();
    displayPrayers();
    bindEvents();
  }

  window.toggleMenu = toggleMenu;
  window.hideMenu = hideMenu;
  window.showVerseTab = showVerseTab;
  window.showPrayerTab = showPrayerTab;
  window.displayDate = displayDate;
  window.fetchRandomVerse = fetchRandomVerse;
  window.submitPrayer = submitPrayer;
  window.displayPrayers = displayPrayers;
  window.initializeApp = initializeApp;

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initializeApp, { once: true });
  } else {
    initializeApp();
  }
})();
</script>
</body>
