/* =========================================================
   UTILITY FUNCTIONS
========================================================= */

function randomInt(max) {

    return Math.floor(
        Math.random() * max
    );

}


function getCurrentUserId() {

    const key =
        'prayer_wall_user_id';

    let id =
        localStorage.getItem(key);

    if (!id) {

        if (
            window.crypto &&
            typeof crypto.randomUUID === 'function'
        ) {

            id = crypto.randomUUID();

        } else {

            id =
                'user-' +
                Date.now() +
                '-' +
                Math.random()
                    .toString(36)
                    .substring(2);

        }

        localStorage.setItem(
            key,
            id
        );

    }

    return id;

}


function formatDate(date = new Date()) {

    return date.toLocaleDateString(
        undefined,
        {
            weekday: 'long',
            year: 'numeric',
            month: 'long',
            day: 'numeric'
        }
    );

}


function formatPrayerDate(value) {

    if (!value) {
        return '';
    }

    const date =
        new Date(value);

    if (
        Number.isNaN(
            date.getTime()
        )
    ) {
        return '';
    }

    return date.toLocaleString();

}

function formatVersePrayer(item) {

    const template =
        templates[
            randomInt(
                templates.length
            )
        ];

    return template
        .replaceAll(
            '{{ref}}',
            item.text
        )
        .replaceAll(
            '{{verse}}',
            item.verse
        );

}


function showVerse(item) {

    document.getElementById(
        'verseReference'
    ).textContent =
        item.text;

    document.getElementById(
        'verseText'
    ).textContent =
        item.verse;

    document.getElementById(
        'versePrayer'
    ).textContent =
        formatVersePrayer(item);

    document.getElementById(
        'verseDate'
    ).textContent =
        formatDate();

    document.getElementById(
        'verseStatus'
    ).textContent = '';

}


function generateVerse() {

    let index =
        randomInt(verses.length);

    const current =
        document.getElementById(
            'verseReference'
        ).textContent;

    if (
        verses.length > 1 &&
        verses[index].text === current
    ) {

        index =
            (index + 1) %
            verses.length;

    }

    showVerse(
        verses[index]
    );

}


function getDateKey() {

    const today =
        new Date();

    return (
        today.getFullYear() +
        '-' +
        String(
            today.getMonth() + 1
        ).padStart(2, '0') +
        '-' +
        String(
            today.getDate()
        ).padStart(2, '0')
    );

}


function loadVerseOfTheDay() {

    const dateKey =
        getDateKey();

    const saved =
        localStorage.getItem(
            'bible_verse_of_the_day'
        );

    if (saved) {

        try {

            const data =
                JSON.parse(saved);

            if (
                data.date === dateKey &&
                Number.isInteger(data.index) &&
                data.index >= 0
            ) {

                showVerse(
                    verses[
                        data.index %
                        verses.length
                    ]
                );

                return;

            }

        } catch (error) {

            console.warn(
                'Could not load saved verse.',
                error
            );

        }

    }


    const index =
        randomInt(
            verses.length
        );


    localStorage.setItem(
        'bible_verse_of_the_day',
        JSON.stringify({
            date: dateKey,
            index
        })
    );


    showVerse(
        verses[index]
    );

}

    } =
        await supabase
            .from('prayers')

async function getReactionCounts(
    prayerId
) {

    if (!supabase) {

        return {};

    }


    const {
        data,
        error
    } =
        await supabase
            .from('prayer_reactions')
            .select('reaction')
            .eq(
                'prayer_id',
                prayerId
            );


    if (error) {

        console.warn(
            'Could not load reactions:',
            error
        );

        return {};

    }


    const counts = {};


    (data || []).forEach(
        row => {

            counts[row.reaction] =
                (
                    counts[row.reaction] ||
                    0
                ) + 1;

        }
    );


    return counts;

}


async function getUserReaction(
    prayerId
) {

    if (!supabase) {

        return null;

    }


    const {
        data,
        error
    } =
        await supabase
            .from('prayer_reactions')
            .select('reaction')
            .eq(
                'prayer_id',
                prayerId
            )
            .eq(
                'user_id',
                getCurrentUserId()
            )
            .maybeSingle();


    if (error) {

        console.warn(
            'Could not load user reaction:',
            error
        );

        return null;

    }


    return data
        ? data.reaction
        : null;

}


/* =========================================================
   TOGGLE REACTION
========================================================= */

async function toggleReaction(
    prayerId,
    reaction
) {

    if (!supabase) {

        alert(
            'Reactions require the Supabase connection.'
        );

        return;

    }


    const userId =
        getCurrentUserId();


    try {

        const {
            data: existing,
            error: findError
        } =
            await supabase
                .from('prayer_reactions')
                .select(
                    'id, reaction'
                )
                .eq(
                    'prayer_id',
                    prayerId
                )
                .eq(
                    'user_id',
                    userId
                )
                .maybeSingle();


        if (findError) {
            throw findError;
        }


        if (existing) {

            if (
                existing.reaction ===
                reaction
            ) {

                const {
                    error
                } =
                    await supabase
                        .from(
                            'prayer_reactions'
                        )
                        .delete()
                        .eq(
                            'id',
                            existing.id
                        );


                if (error) {
                    throw error;
                }

            } else {

                const {
                    error
                } =
                    await supabase
                        .from(
                            'prayer_reactions'
                        )
                        .update({
                            reaction
                        })
                        .eq(
                            'id',
                            existing.id
                        );


                if (error) {
                    throw error;
                }

            }

        } else {

            const {
                error
            } =
                await supabase
                    .from(
                        'prayer_reactions'
                    )
                    .insert({
                        prayer_id:
                            prayerId,

                        user_id:
                            userId,

                        reaction
                    });


            if (error) {
                throw error;
            }

        }


        await displayPrayers();

    } catch (error) {

        console.error(
            'Reaction error:',
            error
        );

        alert(
            'Could not update reaction.'
        );

    }

}

async function renderPrayerItems(

        document.getElementById(
            'prayerList'
        );


    if (!prayers.length) {

        list.innerHTML = `
            <div class="card empty">
                No prayers yet.
                Be the first to post one.
            </div>
        `;

        return;

    }


    const currentUserId =
        getCurrentUserId();


    list.innerHTML = '';


    /*
     * Load reactions in parallel so a large
     * prayer wall doesn't make the page
     * wait for every request one-by-one.
     */

    const reactionData =
        await Promise.all(
            prayers.map(
                async prayer => {

                    const [
                        counts,
                        userReaction
                    ] =
                        await Promise.all([
                            getReactionCounts(
                                prayer.id
                            ),

                            getUserReaction(
                                prayer.id
                            )
                        ]);

                    return {
                        prayer,
                        counts,
                        userReaction
                    };

                }
            )
        );


    reactionData.forEach(
        ({
            prayer,
            counts,
            userReaction
        }) => {

            const wrapper =
                document.createElement(
                    'div'
                );


            wrapper.className =
                'prayer-item';


            const owner =
                prayer.owner_id ===
                currentUserId;


            const createdText =
                formatPrayerDate(
                    prayer.created_at
                );


            wrapper.innerHTML = `

                <div class="prayer-header">

                    <div>

                        <div class="prayer-name">
                            ${escapeHtml(
                                prayer.name ||
                                'Anonymous'
                            )}
                        </div>

                        ${
                            createdText
                                ? `
                                    <div class="prayer-time">
                                        ${escapeHtml(
                                            createdText
                                        )}
                                    </div>
                                  `
                                : ''
                        }

                    </div>

                </div>


                <div class="prayer-content">
                    ${escapeHtml(
                        prayer.content ||
                        ''
                    )}
                </div>


                <div class="reactions">

                    ${reactionTypes
                        .map(
                            reaction => `

                                <button
                                    class="reaction-btn ${
                                        userReaction ===
                                        reaction.key
                                            ? 'active'
                                            : ''
                                    }"
                                    data-reaction="${reaction.key}"
                                    data-prayer-id="${escapeHtml(
                                        prayer.id
                                    )}"
                                    title="${escapeHtml(
                                        reaction.name
                                    )}"
                                >
                                    ${reaction.label}
                                    ${
                                        counts[
                                            reaction.key
                                        ] || 0
                                    }
                                </button>

                            `
                        )
                        .join('')}

                </div>


                ${
                    owner
                        ? `

                            <div class="actions">

                                <button
                                    class="secondary-btn edit-btn"
                                    data-id="${escapeHtml(
                                        prayer.id
                                    )}"
                                >
                                    Edit
                                </button>

                                <button
                                    class="secondary-btn delete-btn"
                                    data-id="${escapeHtml(
                                        prayer.id
                                    )}"
                                >
                                    Delete
                                </button>

                            </div>

                          `
                        : ''
                }

            `;


            list.appendChild(
                wrapper
            );

        }
    );


    /*
     * Reaction buttons
     */

    list
        .querySelectorAll(
            '.reaction-btn'
        )
        .forEach(
            button => {

                button.addEventListener(
                    'click',
                    () => {

                        toggleReaction(
                            button.dataset
                                .prayerId,

                            button.dataset
                                .reaction
                        );

                    }
                );

            }
        );


    /*
     * Delete buttons
     */

    list
        .querySelectorAll(
            '.delete-btn'
        )
        .forEach(
            button => {

                button.addEventListener(
                    'click',
                    () => {

                        deletePrayer(
                            button.dataset.id
                        );

                    }
                );

            }
        );


    /*
     * Edit buttons
     */

    list
        .querySelectorAll(
            '.edit-btn'
        )
        .forEach(
            button => {

                button.addEventListener(
                    'click',
                    () => {

                        editPrayer(
                            button.dataset.id
                        );

                    }
                );

            }
        );

}


/* =========================================================
   DISPLAY PRAYERS
========================================================= */

async function displayPrayers() {

    const list =
        document.getElementById(
            'prayerList'
        );


    list.innerHTML = `
        <div class="card empty loading">
            Loading prayers...
        </div>
    `;


    try {

        const prayers =
            await fetchPrayers();


        await renderPrayerItems(
            prayers
        );


        updateConnectionStatus(
            true
        );

    } catch (error) {

        console.error(
            'Display prayers error:',
            error
        );


        updateConnectionStatus(
            false
        );


        list.innerHTML = `
            <div class="card empty">

                Unable to load prayers.

                <br><br>

                Please check your
                Supabase configuration
                and Row Level Security policies.

            </div>
        `;

    }

}


/* =========================================================
   SUBMIT PRAYER
========================================================= */

async function submitPrayer(
    event
) {

    event.preventDefault();


    const nameInput =
        document.getElementById(
            'nameInput'
        );


    const prayerInput =
        document.getElementById(
            'prayerInput'
        );


    const status =
        document.getElementById(
            'submitStatus'
        );


    const submitBtn =
        document.getElementById(
            'submitBtn'
        );


    const name =
        nameInput.value.trim() ||
        'Anonymous';


    const content =
        prayerInput.value.trim();


    if (!content) {

        setStatus(
            status,
            'Please write a prayer first.',
            'error'
        );

        return;

    }


    if (content.length > 2000) {

        setStatus(
            status,
            'Your prayer is too long.',
            'error'
        );

        return;

    }


    setStatus(
        status,
        'Posting prayer...',
        ''
    );


    submitBtn.disabled =
        true;


    const ownerId =
        getCurrentUserId();


    try {

        if (!supabase) {

            const prayers =
                getLocalPrayers();


            prayers.unshift({

                id:
                    'local-' +
                    Date.now(),

                name,

                content,

                owner_id:
                    ownerId,

                created_at:
                    new Date()
                        .toISOString()

            });


            saveLocalPrayers(
                prayers
            );

        } else {

            const {
                error
            } =
                await supabase
                    .from('prayers')
                    .insert({

                        name,

                        content,

                        owner_id:
                            ownerId

                    });


            if (error) {
                throw error;
            }

        }


        prayerInput.value = '';

        updateCharCount();


        setStatus(
            status,
            'Prayer posted successfully.',
            'success'
        );


        await displayPrayers();

    } catch (error) {

        console.error(
            'Submit prayer error:',
            error
        );


        setStatus(
            status,
            'Could not post prayer.',
            'error'
        );

    } finally {

        submitBtn.disabled =
            false;

    }

}


/* =========================================================
   DELETE PRAYER
========================================================= */

async function deletePrayer(
    id
) {

    if (
        !confirm(
            'Are you sure you want to delete this prayer?'
        )
    ) {
        return;
    }


    try {

        if (!supabase) {

            const prayers =
                getLocalPrayers()
                    .filter(
                        prayer =>
                            prayer.id !== id
                    );


            saveLocalPrayers(
                prayers
            );

        } else {

            const {
                error
            } =
                await supabase
                    .from('prayers')
                    .delete()
                    .eq(
                        'id',
                        id
                    )
                    .eq(
                        'owner_id',
                        getCurrentUserId()
                    );


            if (error) {
                throw error;
            }

        }


        await displayPrayers();

    } catch (error) {

        console.error(
            'Delete error:',
            error
        );


        alert(
            'Could not delete prayer.'
        );

    }

}


/* =========================================================
   EDIT PRAYER
========================================================= */

async function editPrayer(
    id
) {

    let prayer;


    try {

        if (!supabase) {

            prayer =
                getLocalPrayers()
                    .find(
                        item =>
                            item.id === id
                    );

        } else {

            const {
                data,
                error
            } =
                await supabase
                    .from('prayers')
                    .select('*')
                    .eq(
                        'id',
                        id
                    )
                    .eq(
                        'owner_id',
                        getCurrentUserId()
                    )
                    .single();


            if (error) {
                throw error;
            }


            prayer =
                data;

        }


        if (!prayer) {

            alert(
                'Prayer not found.'
            );

            return;

        }


        const newContent =
            prompt(
                'Edit your prayer:',
                prayer.content
            );


        if (
            newContent === null
        ) {
            return;
        }


        const trimmed =
            newContent.trim();


        if (!trimmed) {

            alert(
                'Prayer cannot be empty.'
            );

            return;

        }


        if (
            trimmed.length > 2000
        ) {

            alert(
                'Prayer cannot exceed 2000 characters.'
            );

            return;

        }


        if (!supabase) {

            const prayers =
                getLocalPrayers();


            const index =
                prayers.findIndex(
                    item =>
                        item.id === id
                );


            if (index !== -1) {

                prayers[index].content =
                    trimmed;


                saveLocalPrayers(
                    prayers
                );

            }

        } else {

            const {
                error
            } =
                await supabase
                    .from('prayers')
                    .update({
                        content:
                            trimmed
                    })
                    .eq(
                        'id',
                        id
                    )
                    .eq(
                        'owner_id',
                        getCurrentUserId()
                    );


            if (error) {
                throw error;
            }

        }


        await displayPrayers();

    } catch (error) {

        console.error(
            'Edit error:',
            error
        );


        alert(
            'Could not edit prayer.'
        );

    }

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
    value
) {

    return String(
        value ?? ''
    )
        .replace(
            /&/g,
            '&amp;'
        )
        .replace(
            /</g,
            '&lt;'
        )
        .replace(
            />/g,
            '&gt;'
        )
        .replace(
            /"/g,
            '&quot;'
        )
        .replace(
            /'/g,
            '&#039;'
        );

}


/* =========================================================
   STATUS
========================================================= */

function setStatus(
    element,
    message,
    type
) {

    element.textContent =
        message;

    element.className =
        'status';

    if (type) {

        element.classList.add(
            type
        );

    }

}


function updateConnectionStatus(
    connected
) {

    const dot =
        document.getElementById(
            'connectionDot'
        );

    const text =
        document.getElementById(
            'connectionText'
        );


    if (!supabase) {

        dot.classList.add(
            'offline'
        );

        text.textContent =
            'Local mode';

        return;

    }


    if (connected) {

        dot.classList.remove(
            'offline'
        );

        text.textContent =
            'Connected to Prayer Wall';

    } else {

        dot.classList.add(
            'offline'
        );

        text.textContent =
            'Unable to connect';

    }

}


/* =========================================================
   CHARACTER COUNTER
========================================================= */

function updateCharCount() {

    const input =
        document.getElementById(
            'prayerInput'
        );

    const counter =
        document.getElementById(
            'charCount'
        );


    counter.textContent =
        `${input.value.length} / 2000`;

}


/* =========================================================
   MENU / TABS
========================================================= */

function setupMenu() {

    const menuBtn =
        document.getElementById(
            'menuBtn'
        );


    const menu =
        document.getElementById(
            'menu'
        );


    menuBtn.addEventListener(
        'click',
        () => {

            const open =
                menu.classList.toggle(
                    'open'
                );


            menuBtn.setAttribute(
                'aria-expanded',
                String(open)
            );

        }
    );


    document
        .querySelectorAll(
            '.menu-item'
        )
        .forEach(
            button => {

                button.addEventListener(
                    'click',
                    async () => {

                        const tabId =
                            button.dataset
                                .tab;


                        document
                            .querySelectorAll(
                                '.menu-item'
                            )
                            .forEach(
                                item => {

                                    item.classList
                                        .remove(
                                            'active'
                                        );

                                }
                            );


                        button.classList.add(
                            'active'
                        );


                        document
                            .querySelectorAll(
                                '.tab'
                            )
                            .forEach(
                                tab => {

                                    tab.classList
                                        .remove(
                                            'active'
                                        );

                                }
                            );


                        document
                            .getElementById(
                                tabId
                            )
                            .classList.add(
                                'active'
                            );


                        menu.classList.remove(
                            'open'
                        );


                        menuBtn.setAttribute(
                            'aria-expanded',
                            'false'
                        );


                        if (
                            tabId ===
                            'prayerTab'
                        ) {

                            await displayPrayers();

                        }

                    }
                );

            }
        );

}


/* =========================================================
   INITIALIZE
========================================================= */

async function initializeApp() {

    if (
        window.__prayerAppInitialized
    ) {
        return;
    }


    window.__prayerAppInitialized =
        true;


    setupMenu();


    document
        .getElementById(
            'newVerseBtn'
        )
        .addEventListener(
            'click',
            generateVerse
        );


    document
        .getElementById(
            'prayerForm'
        )
        .addEventListener(
            'submit',
            submitPrayer
        );


    document
        .getElementById(
            'prayerInput'
        )
        .addEventListener(
            'input',
            updateCharCount
        );


    loadVerseOfTheDay();


    updateCharCount();


    updateConnectionStatus(
        Boolean(supabase)
    );


    console.log(
        'Bible app initialized.'
    );


    console.log(
        'Supabase:',
        supabase
            ? 'Connected'
            : 'Not configured'
    );

}


/* =========================================================
   START APP
========================================================= */

if (
    document.readyState ===
    'loading'
) {

    document.addEventListener(
        'DOMContentLoaded',
        initializeApp
    );

} else {

    initializeApp();

}

</script>
